spring.application.name=university-api

# Local MySQL server (the one set up in class). Change DB name / user / password to yours.
spring.datasource.url=jdbc:mysql://localhost:3306/university
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD

# Tables already exist from the DBMS assignment, so Hibernate must not touch them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
